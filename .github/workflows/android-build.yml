# Android Debug Build
# Builds the Capacitor Android app (debug APK, no signing required)
# Runs on push to staging/main and PRs

name: Android Build

on:
  push:
    branches: [main, staging]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main, staging]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: # manual trigger

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "21"

jobs:
  android-build:
    name: Android Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ Build failed - no APK found"
            exit 1
          fi
          echo "✅ Android APK built successfully: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-${{ github.sha }}
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Build summary
        run: |
          APK_SIZE=$(find android/app/build/outputs/apk/debug -name "*.apk" -exec ls -lh {} \; | awk '{print $5}')
          echo "## Android Debug Build ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Type:** Debug APK (sideloadable)" >> $GITHUB_STEP_SUMMARY
          echo "- **App ID:** com.heybub.app" >> $GITHUB_STEP_SUMMARY
          echo "- **Size:** $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** Download from Actions tab" >> $GITHUB_STEP_SUMMARY
