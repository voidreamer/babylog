# Preview Cleanup
# Removes preview deployment when a PR is closed or merged

name: Preview Cleanup

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: ca-central-1
  PREVIEW_BUCKET: heybub-previews

jobs:
  cleanup-preview:
    name: Remove Preview
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete preview from S3
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          echo "Cleaning up preview for PR #${PR_NUM}..."

          # Check if the prefix exists
          OBJECT_COUNT=$(aws s3 ls "s3://${PREVIEW_BUCKET}/pr-${PR_NUM}/" --recursive | wc -l)

          if [ "$OBJECT_COUNT" -gt 0 ]; then
            aws s3 rm "s3://${PREVIEW_BUCKET}/pr-${PR_NUM}/" \
              --recursive \
              --no-cli-pager
            echo "Removed ${OBJECT_COUNT} files from s3://${PREVIEW_BUCKET}/pr-${PR_NUM}/"
          else
            echo "No preview found for PR #${PR_NUM} — nothing to clean up"
          fi

      - name: Update PR comment
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview Deployment')
            );

            if (botComment) {
              const merged = context.payload.pull_request.merged;
              const status = merged ? 'Merged' : 'Closed';
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: `## Preview Deployment\n\n~~Preview removed~~ — PR ${status}.`,
              });
            }
