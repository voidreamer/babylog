name: Deploy Backend (Staging)

# Deploys to STAGING environment
# Triggers on push to 'staging' branch

on:
  push:
    branches: [staging]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-staging.yml'
  workflow_dispatch:

env:
  AWS_REGION: ca-central-1
  # Matches Terraform: ${project_name}-api-${environment}
  LAMBDA_FUNCTION_NAME: simplebaby-api-staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt -t package/
          cp -r app package/
          cp -r alembic package/
          cp alembic.ini package/

      - name: Create deployment package
        run: |
          cd backend/package
          zip -r ../lambda.zip . -q

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Lambda (Staging)
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://backend/lambda.zip \
            --no-cli-pager

      - name: Wait for update to complete
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }}

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "⚠️  DATABASE_URL_STAGING secret not set - skipping migrations"
            exit 0
          fi
          echo "🔄 Running database migrations..."
          cd backend
          pip install -r requirements.txt -q
          alembic upgrade head
          echo "✅ Migrations complete!"

      - name: Verify deployment
        run: |
          aws lambda get-function \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --query 'Configuration.[FunctionName,LastModified,State]' \
            --output table

      - name: Output staging info
        run: |
          echo "🚀 Staging backend deployment complete!"
          echo "📍 Lambda Function: ${{ env.LAMBDA_FUNCTION_NAME }}"
