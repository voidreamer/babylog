# Preview Deployments
# Deploys frontend to a unique URL for each pull request
# Preview URL: https://previews.heybub.app/pr-{number}/

name: Preview Deploy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/preview-deploy.yml'

permissions:
  contents: read
  pull-requests: write  # to post preview URL comment

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"
  AWS_REGION: ca-central-1
  PREVIEW_BUCKET: heybub-previews
  PREVIEW_CF_ID: ${{ secrets.PREVIEW_CLOUDFRONT_ID }}
  PREVIEW_DOMAIN: previews.heybub.app
  STAGING_LAMBDA: simplebaby-api-staging

jobs:
  deploy-preview:
    if: github.actor != 'dependabot[bot]'
    name: Deploy Preview
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check preview infra is ready
        id: check-infra
        run: |
          if [ -z "$PREVIEW_CF_ID" ]; then
            echo "PREVIEW_CLOUDFRONT_ID secret not set — preview infra not provisioned yet."
            echo "This is expected on the first PR before terraform apply creates the preview resources."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: steps.check-infra.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.check-infra.outputs.skip != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Configure AWS credentials
        if: steps.check-infra.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ----- Backend Deploy to Staging -----
      - name: Set up Python
        if: steps.check-infra.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Package backend
        if: steps.check-infra.outputs.skip != 'true'
        run: |
          cd backend
          pip install -r requirements.txt -t package/
          cp -r app package/
          cp -r alembic package/
          cp alembic.ini package/
          cd package && zip -r ../lambda.zip . -q

      - name: Run database migrations
        if: steps.check-infra.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret not set - skipping migrations"
            exit 0
          fi
          cd backend
          pip install -r requirements.txt -q
          alembic upgrade head || echo "⚠️ Migration skipped (staging DB may have migrations from other branches)"

      - name: Deploy backend to staging Lambda
        if: steps.check-infra.outputs.skip != 'true'
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.STAGING_LAMBDA }} \
            --zip-file fileb://backend/lambda.zip \
            --no-cli-pager
          aws lambda wait function-updated \
            --function-name ${{ env.STAGING_LAMBDA }}
          echo "Staging Lambda updated"

      # ----- Frontend Deploy -----
      - name: Install dependencies
        if: steps.check-infra.outputs.skip != 'true'
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        if: steps.check-infra.outputs.skip != 'true'
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL_STAGING }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Set base path so assets resolve correctly under /pr-{number}/
          export VITE_BASE_PATH="/pr-${{ github.event.pull_request.number }}/"
          npm run build -- --base "/pr-${{ github.event.pull_request.number }}/"

      - name: Deploy to S3
        if: steps.check-infra.outputs.skip != 'true'
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          aws s3 sync frontend/dist/ "s3://${PREVIEW_BUCKET}/pr-${PR_NUM}/" \
            --delete \
            --no-cli-pager
          echo "Deployed to s3://${PREVIEW_BUCKET}/pr-${PR_NUM}/"

      - name: Invalidate CloudFront cache
        if: steps.check-infra.outputs.skip != 'true'
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          aws cloudfront create-invalidation \
            --distribution-id "$PREVIEW_CF_ID" \
            --paths "/pr-${PR_NUM}/*" \
            --no-cli-pager

      - name: Post or update PR comment
        if: steps.check-infra.outputs.skip != 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const previewUrl = `https://${process.env.PREVIEW_DOMAIN}/pr-${prNumber}/`;
            const body = [
              `## Preview Deployment`,
              ``,
              `| | |`,
              `|---|---|`,
              `| **URL** | [${previewUrl}](${previewUrl}) |`,
              `| **Branch** | \`${context.payload.pull_request.head.ref}\` |`,
              `| **Commit** | \`${context.sha.slice(0, 7)}\` |`,
              `| **Backend** | Staging API |`,
              ``,
              `> Preview will be removed when this PR is closed.`,
            ].join('\n');

            // Update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview Deployment')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
