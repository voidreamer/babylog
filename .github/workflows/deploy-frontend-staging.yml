name: Deploy Frontend (Staging)

# Deploys to STAGING environment
# Triggers on push to 'staging' branch

on:
  push:
    branches: [staging]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend-staging.yml'
  workflow_dispatch:

env:
  AWS_REGION: ca-central-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      # These are set in GitHub repo Settings > Secrets and variables > Actions > Variables
      S3_BUCKET: ${{ vars.S3_BUCKET_STAGING }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_ID_STAGING }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check staging is configured
        run: |
          if [ -z "${{ vars.S3_BUCKET_STAGING }}" ]; then
            echo "❌ S3_BUCKET_STAGING variable not set in GitHub"
            echo "Go to Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build (Staging)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL_STAGING }}
          VITE_COGNITO_DOMAIN: ${{ secrets.VITE_COGNITO_DOMAIN_STAGING }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID_STAGING }}
          VITE_REDIRECT_URI: ${{ secrets.VITE_REDIRECT_URI_STAGING }}
        run: |
          cd frontend
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3 (Staging)
        run: |
          aws s3 sync frontend/dist/ s3://${{ vars.S3_BUCKET_STAGING }}/ \
            --delete \
            --no-cli-pager

      - name: Invalidate CloudFront cache (Staging)
        if: vars.CLOUDFRONT_ID_STAGING != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_ID_STAGING }} \
            --paths "/*" \
            --no-cli-pager

      - name: Output staging URL
        run: |
          echo "🚀 Staging frontend deployment complete!"
          echo "📍 S3 Bucket: ${{ vars.S3_BUCKET_STAGING }}"
          if [ -n "${{ vars.CLOUDFRONT_ID_STAGING }}" ]; then
            DOMAIN=$(aws cloudfront get-distribution --id ${{ vars.CLOUDFRONT_ID_STAGING }} --query 'Distribution.DomainName' --output text)
            echo "🌐 URL: https://$DOMAIN"
          fi

