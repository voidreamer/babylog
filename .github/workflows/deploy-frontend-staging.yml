name: Deploy Frontend (Staging)

# Deploys to STAGING environment
# Triggers on push to 'staging' branch

on:
  push:
    branches: [staging]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend-staging.yml'
  workflow_dispatch:

env:
  AWS_REGION: ca-central-1
  # Set these in GitHub repo Settings > Variables after running Terraform
  # S3 bucket will be: simplebaby-frontend-staging-XXXXXXXX (from terraform output)
  S3_BUCKET: ${{ vars.S3_BUCKET_STAGING }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_ID_STAGING }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check staging is configured
        run: |
          if [ -z "${{ env.S3_BUCKET }}" ]; then
            echo "❌ S3_BUCKET_STAGING variable not set in GitHub"
            echo "Run 'terraform output -state=terraform-staging.tfstate' and set the variables"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build (Staging)
        env:
          # Staging-specific environment variables
          VITE_API_URL: ${{ secrets.VITE_API_URL_STAGING }}
          VITE_COGNITO_DOMAIN: ${{ secrets.VITE_COGNITO_DOMAIN_STAGING }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID_STAGING }}
          VITE_REDIRECT_URI: ${{ secrets.VITE_REDIRECT_URI_STAGING }}
        run: |
          cd frontend
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3 (Staging)
        run: |
          aws s3 sync frontend/dist/ s3://${{ env.S3_BUCKET }}/ \
            --delete \
            --no-cli-pager

      - name: Invalidate CloudFront cache (Staging)
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --no-cli-pager

      - name: Output staging URL
        run: |
          echo "🚀 Staging frontend deployment complete!"
          echo "📍 S3 Bucket: ${{ env.S3_BUCKET }}"
          if [ -n "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" ]; then
            DOMAIN=$(aws cloudfront get-distribution --id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} --query 'Distribution.DomainName' --output text)
            echo "🌐 URL: https://$DOMAIN"
          fi
