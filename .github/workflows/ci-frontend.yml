name: CI - Frontend Tests

on:
  pull_request:
    paths:
      - 'frontend/**'
  push:
    branches: [develop]
    paths:
      - 'frontend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build
        run: |
          cd frontend
          npm run build

      - name: Check build output
        run: |
          cd frontend
          ls -lh dist/
          echo "✓ Build successful"
