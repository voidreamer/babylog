name: CI - Backend Tests

on:
  pull_request:
    paths:
      - 'backend/**'
  push:
    branches: [develop, staging]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_simplebaby
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_simplebaby
      ENVIRONMENT: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run linter
        run: |
          cd backend
          pip install flake8
          flake8 app --max-line-length=120 --exclude=__pycache__ || true

      - name: Check imports
        run: |
          cd backend
          python -c "from app.main import app; print('✓ Imports successful')"

      - name: Validate models
        run: |
          cd backend
          python -c "from app.models import Baby, Feeding, Diaper, Sleep; print('✓ Models valid')"

      - name: Run tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short
