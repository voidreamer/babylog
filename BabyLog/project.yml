name: BabyLog
options:
  bundleIdPrefix: com.heybub
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: HHN24N354Z
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_FILE: BabyLog/Info.plist

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  BabyLog:
    type: application
    platform: iOS
    sources:
      - path: BabyLog
        excludes:
          - "**/*.xcassets/*/Contents.json"
    resources:
      - path: BabyLog/Assets.xcassets
      - path: BabyLog/Localization/en.lproj
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heybub.babylog
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - package: Supabase
        product: Auth
    info:
      path: BabyLog/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.heybub.babylog
            CFBundleURLSchemes:
              - heybub
        UILaunchScreen: {}
        SUPABASE_URL: https://ztgslfglskfmzakeizoq.supabase.co
