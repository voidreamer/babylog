function Funnel() {

    if (!chartRef.current) return;
    inst.current = new Chart(chartRef.current.getContext('2d'), {
      type: 'bar',
      data: {
        labels: ['App Store View', 'Download', 'Signup', 'First Log', 'Day 7 Active', 'Trial Start', 'Paid Convert'],

        responsive: true,

// ──────── APP ────────

function App() {
  const [active, setActive] = useState('intel');
  useEffect(() => {
    const handler = () => {
      const pos = window.scrollY + 100;
      for (let i = sections.length - 1; i >= 0; i--) {
        const el = document.getElementById(sections[i].id);
        if (el && el.offsetTop <= pos) { setActive(sections[i].id); break; }
      }
    };
    window.addEventListener('scroll', handler);
    return () => window.removeEventListener('scroll', handler);
  }, []);

  return (
    <>
      <Nav active={active} setActive={setActive} />
      <div className="container">
        <Hero />
        <div className="divider" />
        <EnemyIntel />
        <div className="divider" />

        <div className="divider" />
        <Content />
        <div className="divider" />
        <Social />
        <div className="divider" />
        <Retention />
        <div className="divider" />
        <Funnel />
        <div className="divider" />
        <AttackPlan />
        <div className="divider" />
        <KPIs />
        <div className="divider" />
        <WarPlan />
      </div>
    </>
  );
}
