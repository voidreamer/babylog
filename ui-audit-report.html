<title>Babylog UI/UX Audit Report — Updated</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --bg: #0f0f12;
    --surface: #1a1a22;
    --surface-hover: #22222e;
    --border: #2a2a38;
    --text: #e8e6f0;
    --text-secondary: #9896a8;
    --text-muted: #6b6980;
    --critical: #ff4d6a;
    --critical-bg: rgba(255,77,106,0.08);
    --critical-border: rgba(255,77,106,0.2);
    --high: #ff8c42;
    --high-bg: rgba(255,140,66,0.08);
    --high-border: rgba(255,140,66,0.2);
    --medium: #ffc844;
    --medium-bg: rgba(255,200,68,0.08);
    --medium-border: rgba(255,200,68,0.2);
    --low: #44b8ff;
    --low-bg: rgba(68,184,255,0.08);
    --low-border: rgba(68,184,255,0.2);
    --nice: #a78bfa;
    --nice-bg: rgba(167,139,250,0.08);
    --nice-border: rgba(167,139,250,0.2);
    --success: #34d399;
    --success-bg: rgba(52,211,153,0.08);
    --accent: #d4849c;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 2px 12px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .app-container { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

  /* Header */
  .header { text-align: center; margin-bottom: 3rem; padding: 3rem 2rem; background: linear-gradient(135deg, rgba(212,132,156,0.1) 0%, rgba(106,156,184,0.1) 100%); border-radius: 20px; border: 1px solid var(--border); }
  .header h1 { font-size: 2.2rem; font-weight: 700; margin-bottom: 0.5rem; background: linear-gradient(135deg, #d4849c, #6a9cb8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .header p { color: var(--text-secondary); font-size: 1.05rem; }
  .header-meta { display: flex; gap: 2rem; justify-content: center; margin-top: 1.5rem; flex-wrap: wrap; }
  .header-stat { text-align: center; }
  .header-stat-value { font-size: 1.8rem; font-weight: 700; }
  .header-stat-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

  /* Score Ring */
  .score-ring { position: relative; width: 100px; height: 100px; margin: 1.5rem auto 0.5rem; }
  .score-ring svg { transform: rotate(-90deg); }
  .score-ring-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: 700; }

  /* Navigation */
  .nav-tabs { display: flex; gap: 0.5rem; margin-bottom: 2rem; overflow-x: auto; padding-bottom: 0.5rem; position: sticky; top: 0; z-index: 10; background: var(--bg); padding-top: 0.5rem; }
  .nav-tab { padding: 0.6rem 1.2rem; border-radius: 100px; border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary); font-size: 0.85rem; cursor: pointer; white-space: nowrap; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
  .nav-tab:hover { background: var(--surface-hover); color: var(--text); }
  .nav-tab.active { background: var(--accent); color: white; border-color: var(--accent); }
  .nav-tab-count { font-size: 0.75rem; background: rgba(255,255,255,0.15); padding: 0.1rem 0.5rem; border-radius: 100px; }
  .nav-tab.active .nav-tab-count { background: rgba(255,255,255,0.25); }

  /* Filter Bar */
  .filter-bar { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; align-items: center; }
  .filter-chip { padding: 0.4rem 0.9rem; border-radius: 100px; font-size: 0.8rem; cursor: pointer; transition: all 0.15s; border: 1px solid transparent; }
  .filter-chip.critical { background: var(--critical-bg); color: var(--critical); border-color: var(--critical-border); }
  .filter-chip.high { background: var(--high-bg); color: var(--high); border-color: var(--high-border); }
  .filter-chip.medium { background: var(--medium-bg); color: var(--medium); border-color: var(--medium-border); }
  .filter-chip.low { background: var(--low-bg); color: var(--low); border-color: var(--low-border); }
  .filter-chip.nice { background: var(--nice-bg); color: var(--nice); border-color: var(--nice-border); }
  .filter-chip.inactive { opacity: 0.35; }
  .filter-chip:hover { opacity: 1; transform: scale(1.03); }
  .filter-label { font-size: 0.8rem; color: var(--text-muted); margin-right: 0.5rem; }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1rem; transition: all 0.2s; }
  .card:hover { border-color: rgba(212,132,156,0.3); }
  .card-header { display: flex; align-items: flex-start; gap: 1rem; margin-bottom: 1rem; }
  .card-severity { padding: 0.25rem 0.7rem; border-radius: 100px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0; }
  .card-severity.critical { background: var(--critical-bg); color: var(--critical); border: 1px solid var(--critical-border); }
  .card-severity.high { background: var(--high-bg); color: var(--high); border: 1px solid var(--high-border); }
  .card-severity.medium { background: var(--medium-bg); color: var(--medium); border: 1px solid var(--medium-border); }
  .card-severity.low { background: var(--low-bg); color: var(--low); border: 1px solid var(--low-border); }
  .card-severity.nice { background: var(--nice-bg); color: var(--nice); border: 1px solid var(--nice-border); }
  .card-category { padding: 0.25rem 0.7rem; border-radius: 100px; font-size: 0.7rem; color: var(--text-muted); border: 1px solid var(--border); flex-shrink: 0; }
  .card-title { font-size: 1.05rem; font-weight: 600; flex: 1; }
  .card-body { color: var(--text-secondary); font-size: 0.9rem; }
  .card-body p { margin-bottom: 0.75rem; }
  .card-body ul { margin-left: 1.2rem; margin-bottom: 0.75rem; }
  .card-body li { margin-bottom: 0.3rem; }
  .card-body code { background: rgba(212,132,156,0.1); color: var(--accent); padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.82rem; font-family: 'JetBrains Mono', 'Fira Code', monospace; }
  .card-body .file-ref { color: var(--text-muted); font-size: 0.8rem; font-family: 'JetBrains Mono', 'Fira Code', monospace; }

  /* Implementation Steps */
  .steps { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); }
  .steps-title { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.75rem; }
  .step { display: flex; gap: 0.75rem; margin-bottom: 0.6rem; align-items: flex-start; }
  .step-num { width: 22px; height: 22px; border-radius: 50%; background: var(--surface-hover); color: var(--text-muted); font-size: 0.7rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 600; }
  .step-text { color: var(--text-secondary); font-size: 0.85rem; }

  /* Effort badge */
  .effort-badge { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 100px; margin-left: 0.5rem; }
  .effort-badge.quick { background: rgba(52,211,153,0.1); color: #34d399; }
  .effort-badge.moderate { background: rgba(255,200,68,0.1); color: #ffc844; }
  .effort-badge.significant { background: rgba(255,140,66,0.1); color: #ff8c42; }

  /* Expand/Collapse */
  .expand-btn { background: none; border: none; color: var(--accent); font-size: 0.85rem; cursor: pointer; padding: 0.3rem 0; display: flex; align-items: center; gap: 0.3rem; margin-top: 0.5rem; }
  .expand-btn:hover { text-decoration: underline; }

  /* Roadmap section */
  .roadmap { margin-top: 3rem; }
  .roadmap h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; }
  .phase { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1rem; }
  .phase-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; cursor: pointer; }
  .phase-number { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; flex-shrink: 0; }
  .phase-number.p1 { background: var(--critical-bg); color: var(--critical); border: 1px solid var(--critical-border); }
  .phase-number.p2 { background: var(--high-bg); color: var(--high); border: 1px solid var(--high-border); }
  .phase-number.p3 { background: var(--medium-bg); color: var(--medium); border: 1px solid var(--medium-border); }
  .phase-number.p4 { background: var(--nice-bg); color: var(--nice); border: 1px solid var(--nice-border); }
  .phase-title { font-size: 1.1rem; font-weight: 600; }
  .phase-desc { color: var(--text-muted); font-size: 0.85rem; }
  .phase-items { margin-top: 0.5rem; }
  .phase-item { display: flex; gap: 0.5rem; padding: 0.4rem 0; align-items: flex-start; color: var(--text-secondary); font-size: 0.9rem; }
  .phase-item::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; margin-top: 0.55rem; }
  .phase-effort { color: var(--text-muted); font-size: 0.8rem; margin-top: 0.75rem; font-style: italic; }

  /* Progress Overview */
  .progress-overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2.5rem; }
  .progress-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; text-align: center; }
  .progress-card-icon { font-size: 1.5rem; margin-bottom: 0.5rem; }
  .progress-card-value { font-size: 1.8rem; font-weight: 700; }
  .progress-card-label { font-size: 0.8rem; color: var(--text-muted); }

  /* Section Headers */
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; margin-top: 1rem; }
  .section-title { font-size: 1.3rem; font-weight: 700; }
  .section-count { color: var(--text-muted); font-size: 0.9rem; }

  /* Checklist */
  .checklist-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 0.5rem; cursor: pointer; transition: all 0.15s; }
  .checklist-item:hover { background: var(--surface-hover); }
  .checklist-item.checked { opacity: 0.5; }
  .checklist-item.checked .checklist-text { text-decoration: line-through; }
  .checkbox { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .checklist-item.checked .checkbox { background: var(--success); border-color: var(--success); }
  .checklist-text { font-size: 0.9rem; flex: 1; }
  .checklist-sev { font-size: 0.7rem; text-transform: uppercase; font-weight: 600; }

  /* Search */
  .search-bar { width: 100%; padding: 0.7rem 1rem; border-radius: 100px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 0.9rem; margin-bottom: 1rem; outline: none; transition: border-color 0.2s; }
  .search-bar:focus { border-color: var(--accent); }
  .search-bar::placeholder { color: var(--text-muted); }

  /* Stats Grid */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.75rem; margin-bottom: 2rem; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1rem; text-align: center; }
  .stat-value { font-size: 2rem; font-weight: 700; }
  .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.25rem; }

  /* Bar chart */
  .bar-chart { display: flex; align-items: flex-end; gap: 4px; height: 60px; margin-top: 0.5rem; }
  .bar { border-radius: 3px 3px 0 0; flex: 1; min-width: 20px; transition: height 0.3s; }

  /* Resolved state */
  .card.resolved { border-color: rgba(52,211,153,0.3); background: rgba(52,211,153,0.03); }
  .card.resolved .card-title { text-decoration: line-through; color: var(--text-muted); }
  .resolved-badge { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.2rem 0.7rem; border-radius: 100px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; background: var(--success-bg); color: var(--success); border: 1px solid rgba(52,211,153,0.2); }
  .resolved-commit { font-size: 0.75rem; color: var(--text-muted); font-family: 'JetBrains Mono', 'Fira Code', monospace; margin-top: 0.5rem; }

  /* Progress bar */
  .progress-bar-container { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 2rem; }
  .progress-bar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
  .progress-bar-title { font-size: 1rem; font-weight: 600; }
  .progress-bar-pct { font-size: 1.2rem; font-weight: 700; color: var(--success); }
  .progress-bar-track { height: 10px; background: var(--surface-hover); border-radius: 100px; overflow: hidden; }
  .progress-bar-fill { height: 100%; border-radius: 100px; background: linear-gradient(90deg, var(--success), #34d399); transition: width 1s ease; }
  .progress-bar-legend { display: flex; gap: 1.5rem; margin-top: 0.75rem; font-size: 0.8rem; color: var(--text-muted); flex-wrap: wrap; }

  @media (max-width: 768px) {
    .app-container { padding: 1rem 1rem 3rem; }
    .header { padding: 2rem 1rem; }
    .header h1 { font-size: 1.6rem; }
    .header-meta { gap: 1.5rem; }
    .progress-overview { grid-template-columns: repeat(2, 1fr); }
    .nav-tabs { gap: 0.35rem; }
    .nav-tab { padding: 0.5rem 0.8rem; font-size: 0.8rem; }
  }
</style>
</head>

function ScoreRing({ score }) {
  const circumference = 2 * Math.PI * 42;
  const offset = circumference - (score / 100) * circumference;
  const color = score >= 80 ? '#34d399' : score >= 60 ? '#ffc844' : '#ff4d6a';
  return (
    <div className="score-ring">
      <svg width="100" height="100" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="42" fill="none" stroke="var(--border)" strokeWidth="6" />
        <circle cx="50" cy="50" r="42" fill="none" stroke={color} strokeWidth="6"
          strokeLinecap="round" strokeDasharray={circumference} strokeDashoffset={offset}
          style={{ transition: 'stroke-dashoffset 1s ease' }} />
      </svg>
      <div className="score-ring-text" style={{ color }}>{score}</div>
    </div>
  );
}

function FindingCard({ finding, expanded, onToggle }) {
  const isResolved = finding.status === 'resolved';
  return (
    <div className={`card ${isResolved ? 'resolved' : ''}`}>
      <div className="card-header">
        {isResolved && <span className="resolved-badge">&#10003; Resolved</span>}
        <span className={`card-severity ${finding.severity}`}>{finding.severity === 'nice' ? 'nice to have' : finding.severity}</span>
        <span className="card-category">{finding.category}</span>
        <span className={`effort-badge ${finding.effort}`}>
          {finding.effort === 'quick' ? '< 1hr' : finding.effort === 'moderate' ? '2-4hrs' : '1-2 days'}
        </span>
      </div>
      <div className="card-title">{finding.title}</div>
      {isResolved && finding.commit && (
        <div className="resolved-commit">Fixed in commit <code>{finding.commit}</code></div>
      )}
      <div className="card-body">
        <p>{finding.description}</p>
        {finding.files && (
          <p className="file-ref">
            {finding.files.map((f, i) => <span key={i}>{i > 0 ? ' · ' : ''}<code>{f}</code></span>)}
          </p>
        )}
        {expanded && finding.steps && (
          <div className="steps">
            <div className="steps-title">Implementation Steps</div>
            {finding.steps.map((step, i) => (
              <div className="step" key={i}>
                <span className="step-num">{i + 1}</span>
                <span className="step-text">{step}</span>
              </div>
            ))}
          </div>
        )}
        {finding.steps && (
          <button className="expand-btn" onClick={() => onToggle(finding.id)}>
            {expanded ? '▲ Hide steps' : '▼ Show implementation steps'}
          </button>
        )}
      </div>
    </div>
  );
}

function App() {
  const [activeTab, setActiveTab] = useState('all');
  const [activeSeverities, setActiveSeverities] = useState(new Set(['critical', 'high', 'medium', 'low', 'nice']));
  const [expandedCards, setExpandedCards] = useState(new Set());
  const [searchQuery, setSearchQuery] = useState('');
  const [checkedItems, setCheckedItems] = useState(new Set());
  const [showResolved, setShowResolved] = useState(true);

  const toggleSeverity = useCallback((sev) => {
    setActiveSeverities(prev => {
      const next = new Set(prev);
      if (next.has(sev)) next.delete(sev);
      else next.add(sev);
      return next;
    });
  }, []);

  const toggleExpand = useCallback((id) => {
    setExpandedCards(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  }, []);

  const toggleCheck = useCallback((id) => {
    setCheckedItems(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  }, []);

  const categories = useMemo(() => {
    const cats = new Set(FINDINGS.map(f => f.category));
    return ['all', ...Array.from(cats)];
  }, []);

  const filteredFindings = useMemo(() => {
    return FINDINGS.filter(f => {
      if (!activeSeverities.has(f.severity)) return false;
      if (activeTab !== 'all' && f.category !== activeTab) return false;
      if (!showResolved && f.status === 'resolved') return false;
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        return f.title.toLowerCase().includes(q) || f.description.toLowerCase().includes(q) || f.category.toLowerCase().includes(q);
      }
      return true;
    });
  }, [activeTab, activeSeverities, searchQuery, showResolved]);

  const severityCounts = useMemo(() => {
    const counts = { critical: 0, high: 0, medium: 0, low: 0, nice: 0 };
    FINDINGS.forEach(f => counts[f.severity]++);
    return counts;
  }, []);

  const resolvedCount = useMemo(() => FINDINGS.filter(f => f.status === 'resolved').length, []);
  const openCount = FINDINGS.length - resolvedCount;

  const score = useMemo(() => {
    const weights = { critical: 8, high: 5, medium: 3, low: 1, nice: 0 };
    const openPenalty = FINDINGS.filter(f => f.status !== 'resolved').reduce((sum, f) => sum + weights[f.severity], 0);
    const maxPenalty = FINDINGS.length * 8;
    return Math.round(100 - (openPenalty / maxPenalty) * 100);
  }, []);

  const tabCounts = useMemo(() => {
    const counts = { all: FINDINGS.length };
    FINDINGS.forEach(f => {
      counts[f.category] = (counts[f.category] || 0) + 1;
    });
    return counts;
  }, []);

  return (
    <div className="app-container">
      <div className="header">
        <h1>Babylog UI/UX Audit Report</h1>
        <p>Deep analysis of frontend consistency, accessibility, and production readiness</p>
        <ScoreRing score={score} />
        <p style={{ fontSize: '0.85rem', color: 'var(--text-muted)', marginTop: '0.25rem' }}>Production Readiness Score ({resolvedCount}/{FINDINGS.length} resolved)</p>
        <div className="header-meta">
          <div className="header-stat">
            <div className="header-stat-value" style={{ color: 'var(--critical)' }}>{severityCounts.critical}</div>
            <div className="header-stat-label">Critical</div>
          </div>
          <div className="header-stat">
            <div className="header-stat-value" style={{ color: 'var(--high)' }}>{severityCounts.high}</div>
            <div className="header-stat-label">High</div>
          </div>
          <div className="header-stat">
            <div className="header-stat-value" style={{ color: 'var(--medium)' }}>{severityCounts.medium}</div>
            <div className="header-stat-label">Medium</div>
          </div>
          <div className="header-stat">

          </div>
          <div className="header-stat">
            <div className="header-stat-value" style={{ color: 'var(--nice)' }}>{severityCounts.nice}</div>
            <div className="header-stat-label">Nice to Have</div>
          </div>
        </div>
      </div>

      <div className="progress-bar-container">
        <div className="progress-bar-header">
          <span className="progress-bar-title">Resolution Progress</span>
          <span className="progress-bar-pct">{Math.round((resolvedCount / FINDINGS.length) * 100)}%</span>
        </div>
        <div className="progress-bar-track">
          <div className="progress-bar-fill" style={{ width: `${(resolvedCount / FINDINGS.length) * 100}%` }} />
        </div>
        <div className="progress-bar-legend">
          <span style={{ color: 'var(--success)' }}>{resolvedCount} resolved</span>
          <span>{openCount} open</span>
          <span>{FINDINGS.length} total</span>
        </div>
      </div>

      <div className="stats-grid">
        <div className="stat-card">
          <div className="stat-value">{FINDINGS.length}</div>
          <div className="stat-label">Total Findings</div>
        </div>
        <div className="stat-card">
          <div className="stat-value" style={{ color: 'var(--success)' }}>{resolvedCount}</div>
          <div className="stat-label">Resolved</div>
        </div>
        <div className="stat-card">
          <div className="stat-value">{openCount}</div>
          <div className="stat-label">Open</div>
        </div>
        <div className="stat-card">
          <div className="stat-value">53</div>
          <div className="stat-label">Components Audited</div>
        </div>
        <div className="stat-card">
          <div className="stat-value">3700+</div>
          <div className="stat-label">CSS Lines Reviewed</div>
        </div>
        <div className="stat-card">
          <div className="stat-value">8</div>
          <div className="stat-label">Modals Compared</div>
        </div>
      </div>

      <input
        className="search-bar"
        placeholder="Search findings by title, description, or category..."
        value={searchQuery}
        onChange={(e) => setSearchQuery(e.target.value)}
      />

      <div className="nav-tabs">
        {categories.map(cat => (
          <button
            key={cat}
            className={`nav-tab ${activeTab === cat ? 'active' : ''}`}
            onClick={() => setActiveTab(cat)}
          >
            {cat === 'all' ? 'All' : cat}
            <span className="nav-tab-count">{tabCounts[cat] || 0}</span>
          </button>
        ))}
      </div>

      <div className="filter-bar">
        <span className="filter-label">Severity:</span>
        {['critical', 'high', 'medium', 'low', 'nice'].map(sev => (
          <span
            key={sev}
            className={`filter-chip ${sev} ${!activeSeverities.has(sev) ? 'inactive' : ''}`}
            onClick={() => toggleSeverity(sev)}
          >
            {sev === 'nice' ? 'Nice to Have' : sev.charAt(0).toUpperCase() + sev.slice(1)} ({severityCounts[sev]})
          </span>
        ))}
        <span style={{ borderLeft: '1px solid var(--border)', height: '1.5rem', margin: '0 0.5rem' }} />
        <span
          className={`filter-chip ${showResolved ? '' : 'inactive'}`}
          style={{ background: 'var(--success-bg)', color: 'var(--success)', borderColor: 'rgba(52,211,153,0.2)' }}
          onClick={() => setShowResolved(prev => !prev)}
        >
          &#10003; Resolved ({resolvedCount})
        </span>
      </div>

      <div className="section-header">
        <span className="section-title">Findings</span>
        <span className="section-count">{filteredFindings.length} of {FINDINGS.length}</span>
      </div>

      {filteredFindings.map(f => (
        <FindingCard
          key={f.id}
          finding={f}
          expanded={expandedCards.has(f.id)}
          onToggle={toggleExpand}
        />
      ))}

      {filteredFindings.length === 0 && (
        <div className="card" style={{ textAlign: 'center', padding: '3rem' }}>
          <p style={{ fontSize: '1.5rem', marginBottom: '0.5rem' }}>No findings match your filters</p>
          <p style={{ color: 'var(--text-muted)' }}>Try adjusting severity filters or search query</p>
        </div>
      )}

      <div className="roadmap">
        <h2>Production Readiness Roadmap</h2>
        <p style={{ color: 'var(--text-secondary)', marginBottom: '1.5rem', marginTop: '-0.5rem' }}>
          Phased implementation plan to take Babylog from current state to production-ready
        </p>

        {PHASES.map((phase, idx) => {
          const resolvedInPhase = phase.items.filter(i => i.resolved).length;
          const totalInPhase = phase.items.length;
          const phaseComplete = resolvedInPhase === totalInPhase;
          return (
            <div className={`phase ${phaseComplete ? 'resolved' : ''}`} key={idx} style={phaseComplete ? { borderColor: 'rgba(52,211,153,0.3)', background: 'rgba(52,211,153,0.03)' } : {}}>
              <div className="phase-header">
                <span className={`phase-number ${phase.className}`}>{phaseComplete ? '✓' : phase.number}</span>
                <div style={{ flex: 1 }}>
                  <div className="phase-title">{phase.title} <span style={{ fontSize: '0.8rem', color: 'var(--text-muted)', fontWeight: 400 }}>({resolvedInPhase}/{totalInPhase})</span></div>
                  <div className="phase-desc">{phase.desc}</div>
                </div>
              </div>
              <div className="phase-items">
                {phase.items.map((item, i) => {
                  const isChecked = item.resolved || checkedItems.has(`${idx}-${i}`);
                  return (
                    <div
                      key={i}
                      className={`checklist-item ${isChecked ? 'checked' : ''}`}
                      onClick={() => { if (!item.resolved) toggleCheck(`${idx}-${i}`); }}
                      style={item.resolved ? { cursor: 'default' } : {}}
                    >
                      <div className="checkbox">
                        {isChecked && <span style={{ color: 'white', fontSize: '0.7rem' }}>&#10003;</span>}
                      </div>
                      <span className="checklist-text">{item.text}</span>
                    </div>
                  );
                })}
              </div>
              <div className="phase-effort">Estimated effort: {phase.effort}</div>
            </div>
          );
        })}
      </div>

      <div style={{ textAlign: 'center', padding: '2rem 0', color: 'var(--text-muted)', fontSize: '0.85rem' }}>
        Generated by deep codebase analysis — {new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
