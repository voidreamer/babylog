        </p>
      </div>
      <div style={{ textAlign: 'center', padding: '40px 0 20px', color: 'var(--text-muted)', fontSize: 11 }}>
        Generated {new Date().toLocaleDateString()} — HeyBub Hub Platform Analysis
      </div>
    </div>
  );
}

// ──── APP ────
function App() {
  const [active, setActive] = useState('overview');
  useEffect(() => {
    const h = () => { const p = window.scrollY + 100; for (let i = sections.length - 1; i >= 0; i--) { const el = document.getElementById(sections[i].id); if (el && el.offsetTop <= p) { setActive(sections[i].id); break; } } };
    window.addEventListener('scroll', h); return () => window.removeEventListener('scroll', h);
  }, []);
  return (
    <><Nav active={active} setActive={setActive} />
    <div className="container">
      <Overview /><div className="divider"/>
      <Ecosystem /><div className="divider"/>
      <Architecture /><div className="divider"/>
      <Features /><div className="divider"/>
      <Content /><div className="divider"/>
      <Issues /><div className="divider"/>
      <Potential /><div className="divider"/>
      <Synergy /><div className="divider"/>
      <Revenue /><div className="divider"/>
      <Roadmap />
    </div></>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
