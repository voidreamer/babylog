<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BabyLog (HeyBub) — Project Analysis</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #232735;
      --border: #2e3345;
      --text: #e4e7f1;
      --text-dim: #8b91a8;
      --accent: #6366f1;
      --accent-light: #818cf8;
      --green: #22c55e;
      --green-dim: #16a34a;
      --red: #ef4444;
      --red-dim: #dc2626;
      --yellow: #eab308;
      --yellow-dim: #ca8a04;
      --orange: #f97316;
      --blue: #3b82f6;
      --purple: #a855f7;
      --pink: #ec4899;
      --cyan: #06b6d4;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(15, 17, 23, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
    }
    .nav-inner {
      max-width: 1400px; margin: 0 auto;
      display: flex; align-items: center; gap: 8px;
      height: 56px; overflow-x: auto;
    }
    .nav-btn {
      background: none; border: 1px solid transparent; color: var(--text-dim);
      padding: 6px 14px; border-radius: 8px; cursor: pointer;
      font-size: 13px; font-weight: 500; white-space: nowrap;
      transition: all 0.2s;
    }
    .nav-btn:hover { color: var(--text); background: var(--surface); }
    .nav-btn.active {
      color: var(--accent-light); background: rgba(99, 102, 241, 0.1);
      border-color: rgba(99, 102, 241, 0.3);
    }

    .container { max-width: 1400px; margin: 0 auto; padding: 80px 24px 48px; }

    .hero {
      text-align: center; padding: 48px 0 32px;
    }
    .hero h1 {
      font-size: 42px; font-weight: 800;
      background: linear-gradient(135deg, var(--accent-light), var(--purple), var(--pink));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .hero .sub { color: var(--text-dim); font-size: 18px; font-weight: 300; }

    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 12px;
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .badge-green { background: rgba(34,197,94,0.15); color: var(--green); }
    .badge-red { background: rgba(239,68,68,0.15); color: var(--red); }
    .badge-yellow { background: rgba(234,179,8,0.15); color: var(--yellow); }
    .badge-blue { background: rgba(59,130,246,0.15); color: var(--blue); }
    .badge-purple { background: rgba(168,85,247,0.15); color: var(--purple); }

    .section { margin-bottom: 48px; }
    .section-title {
      font-size: 24px; font-weight: 700; margin-bottom: 20px;
      display: flex; align-items: center; gap: 10px;
    }
    .section-title .icon { font-size: 28px; }

    .grid { display: grid; gap: 16px; }
    .grid-2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
    .grid-3 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .grid-4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px;
      transition: all 0.25s;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .card p { color: var(--text-dim); font-size: 14px; }

    .stat-card {
      text-align: center; padding: 24px 16px;
    }
    .stat-card .number {
      font-size: 36px; font-weight: 800;
      background: linear-gradient(135deg, var(--accent-light), var(--cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .stat-card .label { color: var(--text-dim); font-size: 13px; margin-top: 4px; }

    .arch-layer {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px 20px; margin-bottom: 8px;
    }
    .arch-layer-title {
      font-weight: 600; font-size: 13px; text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
    }
    .arch-items { display: flex; flex-wrap: wrap; gap: 8px; }
    .arch-item {
      background: var(--surface2); border: 1px solid var(--border);
      padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 500;
      cursor: default; transition: all 0.2s;
    }
    .arch-item:hover { border-color: var(--accent); background: rgba(99, 102, 241, 0.08); }

    .strength-item, .weakness-item {
      display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      margin-bottom: 8px; transition: all 0.2s;
    }
    .strength-item:hover { border-color: var(--green); }
    .weakness-item:hover { border-color: var(--red); }
    .weakness-item.resolved { border-color: rgba(34,197,94,0.3); background: rgba(34,197,94,0.04); }
    .weakness-item.resolved:hover { border-color: var(--green); }
    .weakness-item.resolved .sw-icon { opacity: 1; }
    .fix-details {
      margin-top: 8px; padding: 10px 12px; background: rgba(34,197,94,0.06);
      border-radius: 8px; border: 1px solid rgba(34,197,94,0.15);
    }
    .fix-details .fix-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--green); margin-bottom: 4px;
    }
    .fix-details ul { list-style: none; margin: 0; padding: 0; }
    .fix-details li {
      font-size: 12px; color: var(--text-dim); padding: 2px 0;
      padding-left: 14px; position: relative;
    }
    .fix-details li::before { content: '→'; position: absolute; left: 0; color: var(--green); }
    .fix-branch {
      display: inline-block; padding: 2px 8px; border-radius: 6px;
      font-size: 11px; font-family: 'SF Mono', 'Fira Code', monospace;
      background: rgba(99,102,241,0.12); color: var(--accent-light);
      border: 1px solid rgba(99,102,241,0.2); margin-top: 6px;
    }
    .progress-summary {
      display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap;
    }
    .progress-pill {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; border-radius: 10px;
      background: var(--surface); border: 1px solid var(--border);
      font-size: 13px; font-weight: 600;
    }
    .progress-pill .dot {
      width: 10px; height: 10px; border-radius: 50%;
    }
    .progress-pill .dot.green { background: var(--green); }
    .progress-pill .dot.yellow { background: var(--yellow); }
    .progress-pill .dot.red { background: var(--red); }
    .sw-icon { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
    .sw-title { font-weight: 600; font-size: 14px; }
    .sw-desc { color: var(--text-dim); font-size: 13px; margin-top: 2px; }

    .competitor-row {
      display: grid; grid-template-columns: 180px repeat(9, 1fr);
      align-items: center; gap: 0;
      border-bottom: 1px solid var(--border); font-size: 13px;
    }
    .competitor-row.header {
      font-weight: 600; color: var(--text-dim); font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.5px;
      border-bottom: 2px solid var(--border);
    }
    .competitor-row > div { padding: 12px 10px; }
    .competitor-row:not(.header):hover { background: var(--surface); }
    .comp-name { font-weight: 600; }
    .comp-check { color: var(--green); text-align: center; }
    .comp-cross { color: var(--red); opacity: 0.5; text-align: center; }
    .comp-partial { color: var(--yellow); text-align: center; }

    .revenue-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 24px; position: relative; overflow: hidden;
    }
    .revenue-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    }
    .revenue-card.tier1::before { background: linear-gradient(90deg, var(--green), var(--cyan)); }
    .revenue-card.tier2::before { background: linear-gradient(90deg, var(--blue), var(--purple)); }
    .revenue-card.tier3::before { background: linear-gradient(90deg, var(--orange), var(--pink)); }
    .revenue-card .tier-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); font-weight: 600; }
    .revenue-card h3 { font-size: 18px; margin: 6px 0; }
    .revenue-card .est {
      font-size: 28px; font-weight: 800; margin: 10px 0;
      background: linear-gradient(135deg, var(--accent-light), var(--cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .revenue-card ul { list-style: none; margin-top: 12px; }
    .revenue-card li { color: var(--text-dim); font-size: 13px; padding: 4px 0; padding-left: 18px; position: relative; }
    .revenue-card li::before { content: '→'; position: absolute; left: 0; color: var(--accent); }

    .roadmap-item {
      display: flex; gap: 16px; padding: 16px 0;
      border-bottom: 1px solid var(--border);
    }
    .roadmap-phase {
      flex-shrink: 0; width: 72px; text-align: center;
      padding: 6px; border-radius: 8px; font-size: 11px;
      font-weight: 700; text-transform: uppercase; height: fit-content;
    }
    .phase-1 { background: rgba(34,197,94,0.15); color: var(--green); }
    .phase-2 { background: rgba(59,130,246,0.15); color: var(--blue); }
    .phase-3 { background: rgba(168,85,247,0.15); color: var(--purple); }
    .phase-4 { background: rgba(249,115,22,0.15); color: var(--orange); }
    .roadmap-content h4 { font-size: 15px; font-weight: 600; }
    .roadmap-content p { color: var(--text-dim); font-size: 13px; margin-top: 4px; }
    .roadmap-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .roadmap-tag {
      padding: 2px 8px; border-radius: 6px; font-size: 11px;
      background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border);
    }

    .chart-container {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px; position: relative;
    }
    .chart-container canvas { max-height: 320px; }

    .tab-bar {
      display: flex; gap: 4px; margin-bottom: 20px;
      background: var(--surface); padding: 4px; border-radius: 10px;
      border: 1px solid var(--border); width: fit-content;
    }
    .tab-btn {
      background: none; border: none; color: var(--text-dim);
      padding: 8px 16px; border-radius: 8px; cursor: pointer;
      font-size: 13px; font-weight: 500; transition: all 0.2s;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { background: var(--accent); color: white; }

    .score-bar {
      height: 8px; background: var(--surface2); border-radius: 4px;
      overflow: hidden; margin-top: 8px;
    }
    .score-fill { height: 100%; border-radius: 4px; transition: width 0.8s ease; }

    .tooltip {
      position: relative; cursor: help;
    }
    .tooltip:hover::after {
      content: attr(data-tip);
      position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
      background: var(--surface2); color: var(--text); padding: 6px 10px;
      border-radius: 6px; font-size: 12px; white-space: nowrap;
      border: 1px solid var(--border); z-index: 10;
    }

    .fade-in { animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    .pulse { animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    .divider {
      height: 1px; background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 32px 0;
    }

    .api-tree {
      font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px; max-height: 420px; overflow-y: auto;
    }
    .api-group { margin-bottom: 12px; }
    .api-group-title {
      font-weight: 600; color: var(--accent-light); cursor: pointer;
      display: flex; align-items: center; gap: 6px;
    }
    .api-group-title:hover { color: var(--accent); }
    .api-endpoint { padding: 2px 0 2px 20px; color: var(--text-dim); }
    .api-method { font-weight: 700; display: inline-block; width: 52px; }
    .api-method.get { color: var(--green); }
    .api-method.post { color: var(--blue); }
    .api-method.put { color: var(--yellow); }
    .api-method.delete { color: var(--red); }
    .api-method.patch { color: var(--purple); }

    .flow-diagram {
      display: flex; align-items: center; justify-content: center;
      gap: 0; flex-wrap: wrap; padding: 24px 0;
    }
    .flow-box {
      background: var(--surface2); border: 1px solid var(--border);
      padding: 12px 18px; border-radius: 10px; text-align: center;
      min-width: 120px; transition: all 0.2s;
    }
    .flow-box:hover { border-color: var(--accent); transform: scale(1.05); }
    .flow-box .flow-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; }
    .flow-box .flow-value { font-weight: 600; font-size: 14px; margin-top: 2px; }
    .flow-arrow { font-size: 20px; color: var(--text-dim); padding: 0 4px; }

    @media (max-width: 768px) {
      .hero h1 { font-size: 28px; }
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
      .competitor-row { grid-template-columns: 120px repeat(9, 1fr); font-size: 11px; }
      .competitor-row > div { padding: 8px 4px; }
      .flow-diagram { flex-direction: column; }
      .flow-arrow { transform: rotate(90deg); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ────────────────────────────── DATA ──────────────────────────────

    const sections = [

    const strengths = [

    function App() {
      const [active, setActive] = useState('overview');

      useEffect(() => {
        const handleScroll = () => {
          const scrollPos = window.scrollY + 100;
          for (let i = sections.length - 1; i >= 0; i--) {
            const el = document.getElementById(sections[i].id);
            if (el && el.offsetTop <= scrollPos) {
              setActive(sections[i].id);
              break;
            }
          }
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

        <>
