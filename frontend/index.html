<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/baby.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#d4849c" />
  <title>HeyBub - Baby Tracker</title>
  <meta name="description" content="Track your baby's sleep, feeding, and diaper changes with ease" />
  <!-- Fonts are self-hosted via @fontsource-variable (imported in main.tsx) for instant loading -->
</head>

<body>
  <div id="root">
    <!-- Inline splash shown while JS loads, replaced by React -->
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:12px;background:#faf5f7;">
      <img src="/icons/loading.png" alt="" style="width:80px;height:80px;animation:_f 2s ease-in-out infinite;filter:drop-shadow(0 4px 12px rgba(212,132,156,.3));">
      <span style="font-family:system-ui,sans-serif;font-weight:600;font-size:1.1rem;color:#8b7e85;opacity:0;animation:_i .8s ease-out .3s forwards;">Getting things ready...</span>
    </div>
    <style>@keyframes _f{0%,100%{transform:translateY(0) scale(1) rotate(0deg);opacity:.85}25%{transform:translateY(-6px) scale(1.03) rotate(-3deg)}50%{transform:translateY(-10px) scale(1.06) rotate(0deg);opacity:1}75%{transform:translateY(-6px) scale(1.03) rotate(3deg)}}@keyframes _i{to{opacity:1}}</style>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
